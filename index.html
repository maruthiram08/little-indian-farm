<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#b5482a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" />
    <title>Little Village Story</title>
    <style>
      /* One committed look: a sunlit village, terracotta and haldi on cream cards. */
      :root {
        --terracotta: #b5482a;
        --haldi: #f2a31f;
        --cream: #fff8e8;
        --edge: #e0b46a;
        --ink: #4a2c12;
        --ink-soft: #8a6a48;
        --leaf: #3f8f3a;
        --shade: rgba(43, 26, 10, 0.55);
        --font: 'Baloo 2', system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif, 'Apple Color Emoji',
          'Segoe UI Emoji', 'Noto Color Emoji';
        color-scheme: light;
      }
      html, body { margin: 0; height: 100%; background: #bfe6f2; overscroll-behavior: none; overflow: hidden;
        font-family: var(--font); color: var(--ink); -webkit-tap-highlight-color: transparent; user-select: none; }
      #game { position: fixed; inset: 0; }
      canvas { display: block; touch-action: none; }
      button { font: inherit; color: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid var(--haldi); outline-offset: 2px; }

      .hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
      .hud button { pointer-events: auto; }

      .top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right)); display: flex; gap: 8px; align-items: center; }
      .pill { background: var(--terracotta); color: #fff; border-radius: 999px; padding: 4px 14px 2px;
        font-weight: 800; font-size: 20px; box-shadow: 0 3px 0 #7d2c17; font-variant-numeric: tabular-nums; }
      .level { flex: 1; max-width: 300px; display: flex; align-items: center; gap: 10px; font-size: 16px; min-width: 0; }
      .xp { flex: 1; height: 10px; background: #7d2c17; border-radius: 99px; overflow: hidden; }
      .xp-fill { height: 100%; width: 0; background: var(--haldi); border-radius: 99px; transition: width 0.4s; }
      .icon-btn { margin-left: auto; border: 0; background: var(--terracotta); color: #ffe3b0; width: 40px; height: 40px; border-radius: 50%;
        font-size: 22px; font-weight: 800; box-shadow: 0 3px 0 #7d2c17; }

      /* Orders are small chips under the top bar: who wants what, and the pay. */
      .orders { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 50px);
        left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right));
        display: flex; flex-wrap: wrap; gap: 6px; }
      .order { display: flex; align-items: center; gap: 6px; background: rgba(255, 248, 232, 0.92);
        border: 2px solid var(--edge); border-radius: 999px; padding: 2px 4px 0 6px; height: 34px; box-sizing: border-box; }
      .order.ready { border-color: var(--leaf); background: #eef7e4; }
      .order-icon { font-size: 18px; line-height: 1; }
      .order-lines { display: flex; gap: 6px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .line.done { color: var(--leaf); }
      .order-reward { font-size: 12px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
      .order.ready .order-reward { color: var(--leaf); font-size: 14px; font-weight: 800; }
      .order-x { border: 0; background: none; color: var(--ink-soft); font-size: 12px; padding: 2px 4px; }
      .labels { position: absolute; inset: 0; }

      .bottom { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right)); display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .store { background: rgba(74, 44, 18, 0.78); color: #fff; font-weight: 700; font-size: 16px; padding: 3px 14px 1px;
        border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .seeds { display: flex; gap: 8px; }
      .seed { width: 76px; height: 76px; border-radius: 18px; border: 3px solid var(--edge); background: var(--cream);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
      .seed.selected { border-color: var(--haldi); background: #ffe3a3; transform: translateY(-3px); }
      .seed.locked { opacity: 0.7; }
      .seed-icon { font-size: 30px; line-height: 1.1; }
      .seed-cost { font-size: 13px; font-weight: 700; color: var(--ink-soft); }

      .label { position: absolute; left: 0; top: 0; background: rgba(255, 248, 232, 0.92); color: var(--ink);
        font-weight: 700; font-size: 14px; padding: 2px 10px 0; border-radius: 999px; white-space: nowrap;
        border: 2px solid var(--edge); will-change: transform; }
      .label.hot { background: var(--haldi); border-color: #c77d0a; color: #fff; }
      .label.small { font-size: 12px; padding: 1px 8px 0; background: rgba(255, 248, 232, 0.85); }
      .label.bubble { font-size: 20px; padding: 0 6px; border-radius: 12px; animation: bob 1s ease-in-out infinite alternate; }
      @keyframes bob { to { margin-top: -6px; } }

      .float { position: absolute; left: 0; top: 0; color: #fff; font-weight: 800; font-size: 24px; white-space: nowrap;
        text-shadow: 0 2px 0 var(--ink), 0 0 6px var(--ink); animation: rise 1s ease-out forwards; }
      @keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -60px; } }

      .toast { position: absolute; z-index: 3; left: 50%; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 130px); transform: translate(-50%, 0) scale(0.9); opacity: 0;
        background: rgba(74, 44, 18, 0.88); color: #fff; font-weight: 700; font-size: 17px; text-align: center;
        padding: 8px 16px 6px; border-radius: 16px; width: max-content; max-width: min(320px, 80vw); transition: opacity 0.25s, transform 0.25s; }
      .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

      .shade { position: absolute; z-index: 4; inset: 0; background: var(--shade); display: grid; place-items: center;
        pointer-events: auto; padding: 0 max(16px, env(safe-area-inset-left)); animation: fade 0.25s; }
      .shade.festive { background: rgba(27, 11, 46, 0.6); }
      @keyframes fade { from { opacity: 0; } }
      .modal { background: var(--cream); border: 4px solid var(--haldi); border-radius: 24px; padding: 20px 22px 18px;
        max-width: 340px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
      .modal h2 { margin: 0 0 6px; font-size: 30px; line-height: 1.1; text-wrap: balance; }
      .modal p { margin: 0 0 16px; font-size: 17px; line-height: 1.4; color: var(--ink); }
      .modal-actions { display: flex; gap: 10px; justify-content: center; }
      .btn { border: 0; border-radius: 14px; padding: 10px 18px 7px; font-weight: 800; font-size: 18px; background: #e8dcc4; }
      .btn.primary { background: var(--leaf); color: #fff; box-shadow: 0 3px 0 #2b6a28; }

      .stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.25); border: 3px solid rgba(255, 255, 255, 0.7); pointer-events: none; z-index: 1; }
      .stick-knob { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.85); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
      .icon-btn + .icon-btn { margin-left: 0; }
      .modal.report { max-width: 360px; width: 100%; box-sizing: border-box; }
      .report-text { width: 100%; box-sizing: border-box; margin: 0 0 14px; font: 13px/1.4 ui-monospace, Menlo, monospace;
        color: var(--ink); background: #fff; border: 2px solid var(--edge); border-radius: 12px; padding: 8px; resize: none;
        user-select: text; max-height: 50vh; }
      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: reduce) { .label.bubble, .float { animation: none; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
