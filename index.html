<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#b5482a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" />
    <title>Little Village Story</title>
    <style>
      /* One committed look: a sunlit village, terracotta and haldi on cream cards. */
      :root {
        --terracotta: #b5482a;
        --haldi: #f2a31f;
        --cream: #fff8e8;
        --edge: #e0b46a;
        --ink: #4a2c12;
        --ink-soft: #8a6a48;
        --leaf: #3f8f3a;
        --shade: rgba(43, 26, 10, 0.55);
        --outline: #3b1d0b;
        --edge-dark: #c9a77a;
        --font: 'Baloo 2', system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif, 'Apple Color Emoji',
          'Segoe UI Emoji', 'Noto Color Emoji';
        color-scheme: light;
      }
      html, body { margin: 0; height: 100%; background: #bfe6f2; overscroll-behavior: none; overflow: hidden;
        font-family: var(--font); color: var(--ink); -webkit-tap-highlight-color: transparent; user-select: none; }
      #game { position: fixed; inset: 0; }
      canvas { display: block; touch-action: none; }
      button { font: inherit; color: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid var(--haldi); outline-offset: 2px; }

      .hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
      .hud button { pointer-events: auto; }
      .ic { width: 1.25em; height: 1.25em; vertical-align: -0.28em; flex: none; }
      /* Bold numbers on colour get a dark outline, like a casual game. */
      .outlined { color: #fff; text-shadow: 0 2px 0 var(--outline), 2px 0 0 var(--outline), -2px 0 0 var(--outline), 0 -2px 0 var(--outline),
        1.5px 1.5px 0 var(--outline), -1.5px 1.5px 0 var(--outline), 1.5px -1.5px 0 var(--outline), -1.5px -1.5px 0 var(--outline); }

      .top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right)); display: flex; gap: 12px; align-items: center; }

      /* Counters: a cream capsule with a big icon sitting over its left end. */
      .counter { position: relative; display: flex; align-items: center; height: 34px; padding: 0 14px 0 34px; margin-left: 14px;
        background: linear-gradient(#fffdf6, #f3e6cc); border: 3px solid #fff; border-radius: 12px;
        box-shadow: 0 3px 0 var(--edge-dark), 0 5px 10px rgba(60, 30, 10, 0.25); }
      .counter-icon { position: absolute; left: -20px; top: 50%; width: 46px; height: 46px; transform: translateY(-50%);
        filter: drop-shadow(0 2px 1px rgba(60, 30, 10, 0.35)); }
      .counter-num { font-weight: 800; font-size: 21px; line-height: 1; padding-top: 3px; color: var(--ink);
        font-variant-numeric: tabular-nums; min-width: 2ch; }

      /* Level: a star badge with the number, then a white-rimmed progress bar. */
      .level { position: relative; flex: 1; max-width: 260px; min-width: 0; display: flex; align-items: center; margin-left: 10px; }
      .star { position: absolute; left: -16px; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; z-index: 1;
        display: grid; place-items: center; filter: drop-shadow(0 2px 1px rgba(60, 30, 10, 0.35)); }
      .star .ic { position: absolute; inset: 0; width: 100%; height: 100%; }
      .star-num { position: relative; font-weight: 800; font-size: 18px; padding-top: 5px; color: #fff;
        text-shadow: 0 2px 0 #8a4b00, 1.5px 0 0 #8a4b00, -1.5px 0 0 #8a4b00, 0 -1.5px 0 #8a4b00; }
      .bar { position: relative; flex: 1; height: 26px; padding: 0; border: 3px solid #fff; border-radius: 99px; overflow: hidden;
        background: linear-gradient(#5b1626, #7c2236); box-shadow: inset 0 3px 4px rgba(0, 0, 0, 0.35), 0 3px 0 var(--edge-dark),
        0 5px 10px rgba(60, 30, 10, 0.25); }
      .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px; transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        background: linear-gradient(#9be15d, #4caf27 60%, #3b9a1e); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.45), inset 0 -3px 0 rgba(0, 0, 0, 0.12); }
      .bar-text { position: relative; display: block; text-align: center; font-weight: 800; font-size: 13px; line-height: 20px; padding: 1px 0 0 20px;
        color: #fff; text-shadow: 0 1.5px 0 var(--outline), 1px 0 0 var(--outline), -1px 0 0 var(--outline), 0 -1px 0 var(--outline); }

      /* Maroon rounded-square buttons with cream icons. */
      .top-buttons { margin-left: auto; display: flex; gap: 8px; }
      .square-btn { width: 44px; height: 44px; padding: 0; border: 3px solid #f6e3c4; border-radius: 13px; display: grid; place-items: center;
        background: linear-gradient(#b23a4c, #8c1d2e 70%); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.25), 0 3px 0 #4e0d18,
        0 5px 10px rgba(60, 30, 10, 0.3); }
      .square-btn .ic { width: 28px; height: 28px; }
      .square-btn:active, .seed:active { transform: translateY(2px); }

      /* Orders: small cream tickets with the villager's face, the goods and the pay. */
      .orders { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 58px);
        left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right));
        display: flex; flex-wrap: wrap; gap: 8px 6px; align-items: center; }
      .order { position: relative; display: flex; align-items: center; gap: 6px; height: 34px; box-sizing: border-box; padding: 0 2px 0 3px;
        background: linear-gradient(#fffdf6, #f3e6cc); border: 2.5px solid #fff; border-radius: 12px;
        box-shadow: 0 2px 0 var(--edge-dark), 0 4px 8px rgba(60, 30, 10, 0.2); }
      .order.ready { border-color: #7fd65a; background: linear-gradient(#f4ffe9, #dcf2c6); }
      .order-face .avatar { width: 28px; height: 28px; display: block; border-radius: 50%; border: 2px solid var(--edge-dark); box-sizing: border-box; }
      .line { display: flex; align-items: center; gap: 1px; font-weight: 800; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums;
        white-space: nowrap; padding-top: 2px; }
      .line .ic { width: 20px; height: 20px; vertical-align: 0; margin-top: -2px; }
      .line.done { color: var(--leaf); }
      .order-reward { display: flex; align-items: center; gap: 1px; font-weight: 800; font-size: 13px; color: #8a5a10; background: #fff3c4;
        border-radius: 8px; padding: 1px 5px 0 2px; white-space: nowrap; }
      .order-reward .ic { width: 17px; height: 17px; vertical-align: 0; }
      .order.ready .order-reward { background: none; padding: 0; }
      .order.ready .order-reward .ic { width: 22px; height: 22px; }
      .order-x { border: 0; background: none; color: #b39673; padding: 4px; display: grid; place-items: center; }
      .order-x .ic { width: 10px; height: 10px; }
      .ride { margin-left: 22px; height: 30px; }
      .ride .counter-icon { width: 40px; height: 40px; }
      .ride .counter-num { font-size: 17px; }
      .labels { position: absolute; inset: 0; }

      .bottom { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right)); display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .goal { position: relative; background: linear-gradient(#fffdf6, #f3e6cc); color: var(--ink); border: 3px solid #fff; font-weight: 700; font-size: 15px;
        line-height: 1.25; padding: 5px 14px 3px; border-radius: 14px; text-align: center; max-width: min(92vw, 420px); box-sizing: border-box;
        box-shadow: 0 3px 0 var(--edge-dark), 0 5px 10px rgba(60, 30, 10, 0.2); }
      .goal:empty { display: none; }
      .basket { display: flex; gap: 6px; align-items: center; min-height: 32px; padding: 2px 8px; border-radius: 14px;
        background: rgba(78, 13, 24, 0.75); border: 2px solid rgba(246, 227, 196, 0.6); }
      .basket.empty { color: #f6e3c4; font-weight: 700; font-size: 14px; padding: 2px 14px 0; }
      .slot { position: relative; display: flex; align-items: center; gap: 2px; }
      .slot .ic { width: 26px; height: 26px; vertical-align: 0; }
      .slot-num { font-weight: 800; font-size: 17px; padding-top: 3px; color: #fff; text-shadow: 0 1.5px 0 #000, 1px 0 0 #000, -1px 0 0 #000; margin-right: 4px; }

      /* Seed tiles: maroon squares with a cream price tag hanging off the bottom. */
      .seeds { display: flex; gap: 14px; padding-bottom: 10px; }
      .seed { position: relative; width: 70px; height: 66px; padding: 0 0 8px; border: 3px solid #f6e3c4; border-radius: 16px;
        display: grid; place-items: center; background: linear-gradient(#b23a4c, #8c1d2e 70%);
        box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.25), 0 4px 0 #4e0d18, 0 6px 12px rgba(60, 30, 10, 0.3); transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s, box-shadow 0.25s; }
      .seed-icon { width: 42px; height: 42px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.3)); }
      .seed.selected { border-color: #ffd34d; transform: translateY(-4px); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.25), 0 4px 0 #4e0d18,
        0 0 0 3px rgba(255, 211, 77, 0.45), 0 8px 14px rgba(60, 30, 10, 0.35); }
      .seed.locked { background: linear-gradient(#8a7a72, #6d5d56 70%); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.2), 0 4px 0 #3e322d; }
      .seed.locked .seed-icon { filter: grayscale(1) brightness(0.8); opacity: 0.6; }
      .seed-lock { position: absolute; width: 28px; height: 28px; top: 14px; left: 50%; transform: translateX(-50%); }
      .tag { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px;
        background: linear-gradient(#fffdf6, #f3e6cc); border: 2px solid #fff; border-radius: 9px; padding: 1px 8px 0 4px;
        font-weight: 800; font-size: 14px; color: var(--ink); white-space: nowrap; box-shadow: 0 2px 0 var(--edge-dark); }
      .tag .ic { width: 18px; height: 18px; vertical-align: 0; }
      .tag.free { color: #fff; background: linear-gradient(#7fd65a, #3f9a2c); border-color: #fff; padding: 1px 9px 0;
        text-shadow: 0 1.5px 0 #23611a; box-shadow: 0 2px 0 #23611a; }

      .label { position: absolute; left: 0; top: 0; background: linear-gradient(#fffdf6, #f3e6cc); color: var(--ink);
        font-weight: 800; font-size: 14px; padding: 2px 10px 0; border-radius: 10px; white-space: nowrap;
        border: 2px solid #fff; box-shadow: 0 2px 0 var(--edge-dark), 0 3px 6px rgba(60, 30, 10, 0.2); will-change: transform; }
      .label .ic { width: 18px; height: 18px; vertical-align: -0.3em; }
      .label.hot { background: linear-gradient(#9be15d, #4caf27); color: #fff; text-shadow: 0 1.5px 0 #23611a; box-shadow: 0 2px 0 #23611a; }
      .label.small { font-size: 12px; padding: 1px 8px 0; }
      .label.bubble { padding: 2px 3px 0; border-radius: 50%; animation: bob 1.6s ease-in-out infinite alternate; }
      .label.bubble .ic { width: 26px; height: 26px; vertical-align: 0; }
      @keyframes bob { to { margin-top: -6px; } }

      .float { position: absolute; left: 0; top: 0; color: #fff; font-weight: 800; font-size: 24px; white-space: nowrap;
        text-shadow: 0 2px 0 var(--outline), 2px 0 0 var(--outline), -2px 0 0 var(--outline), 0 -2px 0 var(--outline);
        animation: rise 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .float .ic { width: 28px; height: 28px; }
      @keyframes rise { 0% { opacity: 0; margin-top: 6px; scale: 0.7; } 15% { opacity: 1; scale: 1.05; } 30% { scale: 1; } 70% { opacity: 1; } 100% { opacity: 0; margin-top: -54px; } }

      .toast { position: absolute; z-index: 3; left: 50%; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 190px); transform: translate(-50%, 0) scale(0.9); opacity: 0;
        background: rgba(78, 13, 24, 0.92); color: #fff; font-weight: 700; font-size: 16px; text-align: center; border: 2px solid #f6e3c4;
        padding: 7px 16px 5px; border-radius: 14px; width: max-content; max-width: min(320px, 80vw); transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
      .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

      .shade { position: absolute; z-index: 4; inset: 0; background: var(--shade); display: grid; place-items: center;
        pointer-events: auto; padding: 0 max(16px, env(safe-area-inset-left)); animation: fade 0.35s ease; }
      .shade.festive { background: rgba(27, 11, 46, 0.6); }
      @keyframes fade { from { opacity: 0; } }
      @keyframes pop { from { opacity: 0; transform: scale(0.85) translateY(12px); } }
      .modal { animation: pop 0.45s cubic-bezier(0.22, 1.3, 0.36, 1); }
      .order { animation: pop 0.4s cubic-bezier(0.22, 1.3, 0.36, 1); }
      .modal { position: relative; background: linear-gradient(#fffdf6, #f3e6cc); border: 4px solid #fff; border-radius: 24px; padding: 34px 22px 18px;
        max-width: 340px; text-align: center; box-shadow: 0 6px 0 var(--edge-dark), 0 12px 30px rgba(0, 0, 0, 0.35); margin-top: 24px; }
      .modal h2 { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); margin: 0; padding: 8px 22px 4px; white-space: nowrap;
        font-size: 26px; line-height: 1.1; color: #fff; border: 3px solid #f6e3c4; border-radius: 14px;
        background: linear-gradient(#b23a4c, #8c1d2e 70%); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.25), 0 3px 0 #4e0d18;
        text-shadow: 0 2px 0 #4e0d18; }
      .modal h2 .ic { width: 26px; height: 26px; }
      .modal p { margin: 0 0 16px; font-size: 17px; line-height: 1.4; color: var(--ink); }
      .modal p .ic { width: 22px; height: 22px; }
      .modal-actions { display: flex; gap: 10px; justify-content: center; }
      .btn { border: 3px solid #fff; border-radius: 14px; padding: 8px 18px 5px; font-weight: 800; font-size: 18px; background: linear-gradient(#f3ead8, #dccdb0);
        box-shadow: 0 3px 0 var(--edge-dark); }
      .btn.primary { background: linear-gradient(#9be15d, #4caf27 60%, #3b9a1e); color: #fff; text-shadow: 0 2px 0 #23611a;
        box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.35), 0 3px 0 #23611a; }

      .stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.25); border: 3px solid rgba(255, 255, 255, 0.7); pointer-events: none; z-index: 1; }
      .stick-knob { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.85); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
      .modal.report { max-width: 360px; width: 100%; box-sizing: border-box; }
      .report-text { width: 100%; box-sizing: border-box; margin: 0 0 14px; font: 13px/1.4 ui-monospace, Menlo, monospace;
        color: var(--ink); background: #fff; border: 2px solid var(--edge); border-radius: 12px; padding: 8px; resize: none;
        user-select: text; max-height: 50vh; }
      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: reduce) { .label.bubble, .float, .modal, .order { animation: none; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
