<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#b5482a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Little Village Story</title>
    <style>
      html, body { margin: 0; height: 100%; background: #bfe6f2; overscroll-behavior: none; overflow: hidden; }
      #game { position: fixed; inset: 0; }
      canvas { display: block; touch-action: none; }
      .stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.25); border: 3px solid rgba(255, 255, 255, 0.7); pointer-events: none; z-index: 5; }
      .stick-knob { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.85); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
      .hint { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
        background: rgba(74, 44, 18, 0.8); color: #fff; font: 600 15px system-ui, sans-serif; padding: 10px 16px;
        border-radius: 999px; pointer-events: none; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="hint">Drag anywhere to walk · preview scene</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
